name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Stage Release Artifacts
        run: |
          mkdir -p release_artifacts
          cp app/build/outputs/apk/release/app-release.apk release_artifacts/RecorderZ.apk
          cd release_artifacts
          sha256sum RecorderZ.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_artifacts/RecorderZ.apk
            release_artifacts/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ### RecorderZ — High-Performance Screen Recorder for Android

            - **Download:** `RecorderZ.apk`
            - **Checksum:** Verify your download against `SHA256SUMS.txt`
            - **Requirements:** Android 10+ (API 29+)
